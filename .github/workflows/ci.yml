name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [accounting-service, sales-service, inventory-service, purchase-service, api-gateway, report-service]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/${{ matrix.service }}
          npm ci

      - name: Lint
        run: |
          cd apps/${{ matrix.service }}
          npm run lint

      - name: Test
        run: |
          cd apps/${{ matrix.service }}
          npm test

      - name: Build
        run: |
          cd apps/${{ matrix.service }}
          npm run build

  database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd packages/database
          npm ci

      - name: Generate Prisma Client
        run: |
          cd packages/database
          npx prisma generate

      - name: Validate Prisma Schema
        run: |
          cd packages/database
          npx prisma validate
