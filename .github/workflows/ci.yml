name: CI

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Lint
        run: npm run lint || echo "Lint skipped if no script"

      - name: Test
        run: npm test || echo "Tests skipped if no script"

  database:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            echo "Generating client for $schema"
            npx prisma generate --schema="$schema"
          done

      - name: Validate Prisma schemas
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            echo "Validating $schema"
            npx prisma validate --schema="$schema"
          done

      - name: Check schema diff (informational)
        if: github.event_name == 'pull_request'
        run: |
          echo "=== Prisma schema files changed in this PR ==="
          git diff --name-only origin/${{ github.base_ref }}...HEAD -- '*/prisma/schema.prisma' || echo "No schema changes"
