name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Release to /home/deploy/stovash-demo/backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack source
        run: |
          tar czf /tmp/stovash-backend-demo.tgz \
            --exclude .git \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude '**/src/generated/prisma' \
            .
          mv /tmp/stovash-backend-demo.tgz .

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          source: stovash-backend-demo.tgz
          target: /tmp

      - name: Activate demo release
        uses: appleboy/ssh-action@v1.2.2
        env:
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          command_timeout: 80m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            export STOVASH_ROOT=/home/deploy/stovash-demo/backend
            export STOVASH_COMPOSE_PROJECT=stovash-demo-backend
            export STOVASH_IMAGE=stovash-demo-backend
            export STOVASH_CONTAINER=stovash-demo-backend
            export STOVASH_ENV_FILE=/home/deploy/stovash-demo/backend/shared/.env
            export STOVASH_PORT=5061
            mkdir -p "$STOVASH_ROOT/releases" "$STOVASH_ROOT/shared"
            REL="$STOVASH_ROOT/releases/$(date -u +%Y%m%d%H%M%S)_${GITHUB_SHA:0:7}"
            mkdir -p "$REL"
            tar xzf /tmp/stovash-backend-demo.tgz -C "$REL"
            chmod +x "$REL/deploy/release.sh" "$REL/deploy/ensure-docker.sh"
            "$REL/deploy/release.sh" "$REL"
            chown -R deploy:deploy /home/deploy/stovash-demo 2>/dev/null || true
            docker-compose -p stovash-demo-backend ps
