server {
    listen 80;
    listen [::]:80;
    server_name demo.stovash.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:5060;
        include /etc/nginx/snippets/stovash-proxy.conf;
    }
}
