name: Backend Deployment

on:
  push:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/stovash-backend

jobs:
  build:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          for schema in apps/*/prisma/schema.prisma packages/database/prisma/identity-rbac.prisma; do
            echo "Generating client for $schema"
            npx prisma@5.22.0 generate --schema="$schema"
          done

      - name: Validate backend and RBAC client
        run: |
          npm run build
          npm run verify:rbac-client
          npm run db:migration:inventory
          npm run db:migration:safety

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy backend image to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Package deployment scripts
        run: tar czf stovash-backend-deploy.tgz deploy/release-ghcr.sh deploy/ensure-docker.sh

      - name: Upload deployment scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: stovash-backend-deploy.tgz
          target: /tmp

      - name: Activate image deployment
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USER: ${{ secrets.GHCR_USER || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          TAG: ${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 12m
          envs: GHCR_USER,GHCR_TOKEN,IMAGE,TAG
          script: |
            set -euo pipefail
            ROOT=/home/deploy/stovash/backend
            mkdir -p "$ROOT/releases" "$ROOT/shared"
            REL="$ROOT/releases/$(date -u +%Y%m%d%H%M%S)_${TAG}"
            mkdir -p "$REL"
            tar xzf /tmp/stovash-backend-deploy.tgz -C "$REL"
            chmod +x "$REL/deploy/release-ghcr.sh" "$REL/deploy/ensure-docker.sh"
            export STOVASH_ROOT="$ROOT"
            export STOVASH_COMPOSE_PROJECT=stovash-backend
            export STOVASH_CONTAINER=stovash-backend
            export STOVASH_PORT=5051
            "$REL/deploy/release-ghcr.sh" "$IMAGE" "$TAG"
            rm -f /tmp/stovash-backend-deploy.tgz
