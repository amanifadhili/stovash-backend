name: Backend Deployment

on:
  push:
    branches:
      - main        # Triggers demo deployment
      - production  # Triggers production deployment
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_type=demo" >> $GITHUB_OUTPUT
            echo "ghcr_image=ghcr.io/${{ github.repository_owner }}/stovash-backend-demo" >> $GITHUB_OUTPUT
          else
            echo "env_type=production" >> $GITHUB_OUTPUT
            echo "ghcr_image=ghcr.io/${{ github.repository_owner }}/stovash-backend" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.env.outputs.ghcr_image }}:${{ steps.env.outputs.short_sha }}
            ${{ steps.env.outputs.ghcr_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      env_type: ${{ steps.env.outputs.env_type }}
      ghcr_image: ${{ steps.env.outputs.ghcr_image }}
      short_sha: ${{ steps.env.outputs.short_sha }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via release-ghcr.sh
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            ROOT="/home/deploy/stovash/backend"
            IMAGE="${{ needs.build-and-push.outputs.ghcr_image }}"
            TAG="${{ needs.build-and-push.outputs.short_sha }}"
            CONTAINER="stovash-backend"
            ENV_FILE="${ROOT}/shared/.env"

            echo "=== Deploying ${IMAGE}:${TAG} ==="

            # Ensure directory structure
            mkdir -p "$ROOT/shared" "$ROOT/releases"

            # Ensure .env exists
            if [[ ! -f "$ENV_FILE" ]]; then
              echo "ERROR: Missing $ENV_FILE"
              exit 1
            fi

            # Pull image with retry
            for i in 1 2 3 4 5; do
              if docker pull "${IMAGE}:${TAG}" 2>&1; then
                echo "Pull succeeded on attempt $i"
                break
              fi
              if [[ $i -eq 5 ]]; then
                echo "ERROR: Failed to pull ${IMAGE}:${TAG} after 5 attempts"
                exit 1
              fi
              WAIT=$((i * 15))
              echo "Pull failed, retrying in ${WAIT}s... (attempt $i/5)"
              sleep "$WAIT"
            done

            # Create release directory
            REL="$ROOT/releases/$(date -u +%Y%m%d%H%M%S)_${TAG}"
            mkdir -p "$REL"

            # Write docker-compose.yml
            cat > "$ROOT/docker-compose.yml" <<COMPOSE
            services:
              api:
                image: ${IMAGE}:${TAG}
                container_name: ${CONTAINER}
                restart: unless-stopped
                network_mode: host
                env_file:
                  - ${ENV_FILE}
                environment:
                  NODE_ENV: production
                  PORT: "5051"
            COMPOSE

            # Stop old container, start new one
            echo "Removing old container..."
            timeout 30 docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            echo "Starting new container..."
            timeout 120 docker compose -f "$ROOT/docker-compose.yml" -p stovash-backend up -d --no-build --force-recreate

            # Wait for API to be healthy (max 90s)
            echo "Waiting for API to be ready..."
            for i in $(seq 1 18); do
              sleep 5
              if curl -sf --connect-timeout 3 --max-time 5 "http://127.0.0.1:5051/health" >/dev/null 2>&1; then
                echo "API is up on port 5051"
                break
              fi
              if [[ $i -eq 18 ]]; then
                echo "WARNING: API not responding after 90s"
                docker logs --tail=50 "$CONTAINER" 2>&1 || true
              fi
            done

            # Schema sync for ALL services
            echo "Syncing Prisma schemas..."
            for svc in identity tenant customer supplier accounting inventory sales purchase treasury report; do
              echo "  prisma db push ${svc}-service"
              timeout --kill-after=10 90 docker exec "$CONTAINER" bash -lc \
                "cd /app/apps/${svc}-service && /app/node_modules/.bin/prisma db push --skip-generate --schema=prisma/schema.prisma" >/dev/null 2>&1 \
                || echo "  (skip/timeout for $svc)"
            done
            echo "Schema sync completed."

            # Symlink current
            ln -sfn "$REL" "$ROOT/current"
            echo "${IMAGE}:${TAG}" > "$ROOT/shared/deployed-image"

            # Cleanup old images (keep last 3)
            mapfile -t old_images < <(docker images "$IMAGE" --format '{{.Tag}}' | grep -v latest | sort -r | tail -n +4)
            for img in "${old_images[@]}"; do
              timeout 60 docker rmi "${IMAGE}:${img}" 2>/dev/null || true
            done

            # Cleanup old releases (keep last 3)
            mapfile -t old < <(ls -1dt "$ROOT/releases"/* 2>/dev/null | tail -n +4)
            if ((${#old[@]})); then rm -rf "${old[@]}"; fi

            echo "✅ ${IMAGE}:${TAG} deployed successfully"

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed for ${{ needs.build-and-push.outputs.env_type }}"
          echo "📦 Image: ${{ needs.build-and-push.outputs.ghcr_image }}:${{ needs.build-and-push.outputs.short_sha }}"
          echo "🚀 Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Deployment failed - check logs for details')
