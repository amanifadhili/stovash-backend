name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-demo-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/stovash-backend-demo

jobs:
  # ── 1. Build & push Docker image to ghcr.io ───────────────────────────────
  build:
    name: Build & push demo image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  # ── 2. Deploy to VPS ───────────────────────────────────────────────────────
  deploy:
    name: Release to /home/deploy/stovash-demo/backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ needs.build.outputs.sha }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          envs: IMAGE_TAG,IMAGE
          script: |
            set -euo pipefail
            ROOT="/home/deploy/stovash-demo/backend"
            mkdir -p "$ROOT/shared"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker pull "${IMAGE}:${IMAGE_TAG}"

            cat > "$ROOT/docker-compose.yml" <<EOF
            services:
              api:
                image: ${IMAGE}:${IMAGE_TAG}
                container_name: stovash-demo-backend
                restart: unless-stopped
                network_mode: host
                env_file:
                  - $ROOT/shared/.env
                environment:
                  NODE_ENV: production
                  PORT: "5061"
            EOF

            docker rm -f stovash-demo-backend >/dev/null 2>&1 || true
            docker-compose -f "$ROOT/docker-compose.yml" -p stovash-demo-backend up -d --no-build --force-recreate

            # Schema sync
            echo "Syncing Prisma schemas..."
            for svc in identity tenant customer supplier accounting inventory sales purchase treasury report; do
              docker exec stovash-demo-backend bash -lc \
                "cd /app/apps/${svc}-service && /app/node_modules/.bin/prisma db push --skip-generate --schema=prisma/schema.prisma"
            done

            echo "${IMAGE}:${IMAGE_TAG}" > "$ROOT/shared/deployed-image"
            echo "Deployed ${IMAGE}:${IMAGE_TAG}"

            docker images "${IMAGE}" --format '{{.Tag}}' \
              | grep -v latest | sort -r | tail -n +6 \
              | xargs -I{} docker rmi "${IMAGE}:{}" 2>/dev/null || true
