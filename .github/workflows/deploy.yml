name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/stovash-backend

jobs:
  # ── 1. Build & push Docker image to ghcr.io ───────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  # ── 2. Deploy to VPS ───────────────────────────────────────────────────────
  deploy:
    name: Release to /home/deploy/stovash/backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Pack deploy scripts only
        run: |
          tar czf /tmp/stovash-backend-deploy.tgz deploy/
          mv /tmp/stovash-backend-deploy.tgz .

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          source: stovash-backend-deploy.tgz
          target: /tmp

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ needs.build.outputs.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE: ${{ env.IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          envs: IMAGE_TAG,REGISTRY,IMAGE,GITHUB_SHA
          script: |
            set -euo pipefail
            ROOT="/home/deploy/stovash/backend"
            mkdir -p "$ROOT/releases" "$ROOT/shared"

            # Extract deploy scripts for this release
            REL="$ROOT/releases/$(date -u +%Y%m%d%H%M%S)_${GITHUB_SHA:0:7}"
            mkdir -p "$REL"
            tar xzf /tmp/stovash-backend-deploy.tgz -C "$REL"

            # Authenticate to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # Pull the exact SHA-tagged image built in CI
            docker pull "${IMAGE}:${IMAGE_TAG}"

            # Write docker-compose with the exact image tag
            cat > "$ROOT/docker-compose.yml" <<EOF
            services:
              api:
                image: ${IMAGE}:${IMAGE_TAG}
                container_name: stovash-backend
                restart: unless-stopped
                network_mode: host
                env_file:
                  - $ROOT/shared/.env
                environment:
                  NODE_ENV: production
                  PORT: "5051"
            EOF

            docker rm -f stovash-backend >/dev/null 2>&1 || true
            docker-compose -f "$ROOT/docker-compose.yml" -p stovash-backend up -d --no-build --force-recreate

            # Schema sync after container starts
            echo "Syncing Prisma schemas..."
            for svc in identity tenant customer supplier accounting inventory sales purchase treasury report; do
              echo "  prisma db push ${svc}-service"
              docker exec stovash-backend bash -lc \
                "cd /app/apps/${svc}-service && /app/node_modules/.bin/prisma db push --skip-generate --schema=prisma/schema.prisma"
            done

            ln -sfn "$REL" "$ROOT/current"
            echo "${IMAGE}:${IMAGE_TAG}" > "$ROOT/shared/deployed-image"
            echo "Deployed ${IMAGE}:${IMAGE_TAG}"

            # Keep only last 5 images
            docker images "${IMAGE}" --format '{{.Tag}}' \
              | grep -v latest \
              | sort -r \
              | tail -n +6 \
              | xargs -I{} docker rmi "${IMAGE}:{}" 2>/dev/null || true

            # Keep last 3 releases
            mapfile -t old < <(ls -1dt "$ROOT/releases"/* 2>/dev/null | tail -n +4)
            if ((${#old[@]})); then rm -rf "${old[@]}"; fi

            docker-compose -f "$ROOT/docker-compose.yml" -p stovash-backend ps
