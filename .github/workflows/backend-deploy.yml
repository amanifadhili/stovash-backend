name: Backend Deployment

on:
  push:
    branches:
      - main        # Triggers demo deployment
      - production  # Triggers production deployment
  workflow_dispatch:  # Allows manual triggering

concurrency:
  group: backend-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS via PM2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_type=demo" >> $GITHUB_OUTPUT
          else
            echo "env_type=production" >> $GITHUB_OUTPUT
          fi
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "full_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail

            ROOT="/home/deploy/stovash/backend"
            ENV_FILE="${ROOT}/shared/.env"
            SHORT_SHA="${{ steps.env.outputs.short_sha }}"
            FULL_SHA="${{ steps.env.outputs.full_sha }}"
            REL="$ROOT/releases/$(date -u +%Y%m%d%H%M%S)_${SHORT_SHA}"

            echo "=== Deploying commit ${SHORT_SHA} ==="

            # Ensure directory structure
            mkdir -p "$ROOT/shared" "$ROOT/releases"

            # Ensure .env exists
            if [[ ! -f "$ENV_FILE" ]]; then
              echo "ERROR: Missing $ENV_FILE"
              exit 1
            fi

            # Create release directory and clone repo
            mkdir -p "$REL"
            git clone --depth 1 https://github.com/${{ github.repository }}.git "$REL"
            cd "$REL"
            git fetch origin ${{ github.ref_name }}
            git checkout "${FULL_SHA}"

            # Install dependencies
            echo "Installing dependencies..."
            npm ci

            # Generate Prisma clients for all services
            echo "Generating Prisma clients..."
            for schema in apps/*/prisma/schema.prisma; do
              if [[ -f "$schema" ]]; then
                echo "  prisma generate $schema"
                npx prisma@5.22.0 generate --schema="$schema" || echo "  (failed for $schema)"
              fi
            done

            # Build
            echo "Building..."
            npm run build

            # Schema sync for ALL services
            echo "Syncing Prisma schemas to database..."
            set -a && source "$ENV_FILE" && set +a
            for svc in identity tenant customer supplier accounting inventory sales purchase treasury report; do
              if [[ -f "apps/${svc}-service/prisma/schema.prisma" ]]; then
                echo "  prisma db push ${svc}-service"
                timeout --kill-after=10 90 npx prisma@5.22.0 db push \
                  --schema="apps/${svc}-service/prisma/schema.prisma" \
                  --accept-data-loss \
                  >/dev/null 2>&1 \
                  || echo "  (skip/timeout for $svc)"
              fi
            done
            echo "Schema sync completed."

            # Update symlink
            ln -sfn "$REL" "$ROOT/current"
            echo "${SHORT_SHA}" > "$ROOT/shared/deployed-sha"

            # Restart PM2
            echo "Restarting PM2..."
            pm2 restart stovash-backend --update-env 2>/dev/null \
              || pm2 start "$REL/dist/server.js" \
                   --name stovash-backend \
                   --cwd "$REL" \
                   --update-env

            # Wait for API to be healthy (max 60s)
            echo "Waiting for API to be ready..."
            for i in $(seq 1 12); do
              sleep 5
              if curl -sf --connect-timeout 3 --max-time 5 "http://127.0.0.1:5051/health" >/dev/null 2>&1; then
                echo "API is up on port 5051"
                break
              fi
              if [[ $i -eq 12 ]]; then
                echo "WARNING: API not responding after 60s"
                pm2 logs stovash-backend --lines 30 --nostream 2>&1 || true
              fi
            done

            # Cleanup old releases (keep last 3)
            mapfile -t old < <(ls -1dt "$ROOT/releases"/* 2>/dev/null | tail -n +4)
            if ((${#old[@]})); then
              echo "Cleaning up old releases..."
              rm -rf "${old[@]}"
            fi

            echo "✅ Deployed ${SHORT_SHA} successfully"

      - name: Verify deployment
        run: |
          echo "✅ Deployment completed for ${{ steps.env.outputs.env_type }}"
          echo "🚀 Commit: ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            core.setFailed('Deployment failed - check logs for details')
