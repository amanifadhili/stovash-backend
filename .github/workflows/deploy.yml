name: Deploy PM2

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: backend-deploy-pm2
  cancel-in-progress: false

jobs:
  # ── 1. Build application ───────────────────────────────────────────────────────
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment artifact
        run: |
          tar czf /tmp/stovash-backend-dist.tgz dist/ package.json package-lock.json apps/ packages/ frameworks/ .env

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stovash-backend-dist
          path: /tmp/stovash-backend-dist.tgz
          retention-days: 7

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  # ── 2. Deploy to VPS via PM2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS via PM2
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: stovash-backend-dist

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          SSH_KEY=$(mktemp)
          echo "$SSH_PRIVATE_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          # Write SSH config
          SSH_CFG=$(mktemp)
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  ServerAliveInterval 15\n  ServerAliveCountMax 20\n  AddressFamily inet\n' \
            "$VPS_HOST" "$VPS_USER" "$VPS_PORT" "$SSH_KEY" > "$SSH_CFG"

          # Upload artifact
          scp -F "$SSH_CFG" stovash-backend-dist.tgz "vps:~/stovash-backend-dist.tgz"

          # Deploy on VPS
          ssh -F "$SSH_CFG" vps \
            "set -euo pipefail && \
             ROOT=/home/deploy/stovash/backend && \
             REL=\$ROOT/releases/\$(date -u +%Y%m%d%H%M%S)_${SHA} && \
             mkdir -p \$REL && \
             tar xzf ~/stovash-backend-dist.tgz -C \$REL && \
             rm -f ~/stovash-backend-dist.tgz && \
             cd \$REL && \
             npm ci --omit=dev && \
             npm run db:generate && \
             mkdir -p \$ROOT/shared && \
             pm2 stop stovash-backend || true && \
             pm2 delete stovash-backend || true && \
             pm2 start dist/server.js --name stovash-backend --env \$ROOT/shared/.env && \
             pm2 save && \
             ln -sfn \$REL \$ROOT/current && \
             echo '=== PM2 Deployment Complete ===' && \
             pm2 status && \
             echo '=== Testing Backend ===' && \
             curl -sf --connect-timeout 3 --max-time 5 'http://127.0.0.1:5051/docs' && echo ' Backend is responding' || echo ' Backend not responding yet'"

          rm -f "$SSH_KEY" "$SSH_CFG"
