name: TLS

on:
  workflow_dispatch:
    inputs:
      method:
        description: Certificate method
        type: choice
        default: nginx
        options:
          - nginx
          - webroot

jobs:
  certificates:
    name: Issue api.stovash.com certificate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Upload API nginx site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          source: deploy
          target: /tmp/stovash-api-edge

      - name: Issue certificate
        uses: appleboy/ssh-action@v1.2.2
        env:
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          METHOD: ${{ github.event.inputs.method }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          envs: CERTBOT_EMAIL,METHOD
          script: |
            set -euo pipefail
            mkdir -p /var/www/certbot /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/snippets /etc/nginx/conf.d
            MAP_SRC="$(find /tmp/stovash-api-edge -name stovash-map.conf | head -n 1)"
            PROXY_SRC="$(find /tmp/stovash-api-edge -name stovash-proxy.conf | head -n 1)"
            SITE_SRC="$(find /tmp/stovash-api-edge -name api.stovash.com.conf | head -n 1)"
            [ -n "$MAP_SRC" ] && cp "$MAP_SRC" /etc/nginx/conf.d/stovash-map.conf
            [ -n "$PROXY_SRC" ] && cp "$PROXY_SRC" /etc/nginx/snippets/stovash-proxy.conf
            cp "$SITE_SRC" /etc/nginx/sites-available/api.stovash.com
            ln -sfn /etc/nginx/sites-available/api.stovash.com /etc/nginx/sites-enabled/api.stovash.com
            nginx -t && systemctl reload nginx
            EMAIL="${CERTBOT_EMAIL:-admin@stovash.com}"
            if [ "$METHOD" = "webroot" ]; then
              certbot certonly --webroot --non-interactive --agree-tos --email "$EMAIL" \
                -w /var/www/certbot -d api.stovash.com
            else
              certbot --nginx --non-interactive --agree-tos --email "$EMAIL" --redirect \
                -d api.stovash.com
            fi
            nginx -t && systemctl reload nginx
