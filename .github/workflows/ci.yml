name: CI

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  # Build and test all services
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Lint
        run: npm run lint || echo "Lint skipped if no script"

      - name: Test
        run: npm test || echo "Tests skipped if no script"

  # Database validation
  database:
    name: Database Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: |
          npx prisma generate --schema apps/identity-service/prisma/schema.prisma
          npx prisma generate --schema apps/accounting-service/prisma/schema.prisma
          npx prisma generate --schema apps/customer-service/prisma/schema.prisma
          npx prisma generate --schema apps/inventory-service/prisma/schema.prisma
          npx prisma generate --schema apps/sales-service/prisma/schema.prisma
          npx prisma generate --schema apps/purchase-service/prisma/schema.prisma
          npx prisma generate --schema apps/treasury-service/prisma/schema.prisma
          npx prisma generate --schema apps/tenant-service/prisma/schema.prisma
          npx prisma generate --schema apps/supplier-service/prisma/schema.prisma

      - name: Validate Prisma schemas
        run: |
          npx prisma validate --schema apps/identity-service/prisma/schema.prisma
          npx prisma validate --schema apps/accounting-service/prisma/schema.prisma
          npx prisma validate --schema apps/customer-service/prisma/schema.prisma
          npx prisma validate --schema apps/inventory-service/prisma/schema.prisma
          npx prisma validate --schema apps/sales-service/prisma/schema.prisma
          npx prisma validate --schema apps/purchase-service/prisma/schema.prisma
          npx prisma validate --schema apps/treasury-service/prisma/schema.prisma
          npx prisma validate --schema apps/tenant-service/prisma/schema.prisma
          npx prisma validate --schema apps/supplier-service/prisma/schema.prisma

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for security vulnerabilities
        run: npm audit || echo "Audit warnings found"

      - name: Check for outdated dependencies
        run: npm outdated || echo "Some packages may be outdated"