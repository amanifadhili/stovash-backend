services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22-bookworm-slim}
    image: ${COMPOSE_IMAGE:-stovash-backend}:${RELEASE_ID:-latest}
    container_name: ${COMPOSE_CONTAINER:-stovash-backend}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "${STOVASH_PORT:-5051}"
    volumes:
      - ${ENV_FILE:-/home/deploy/stovash/backend/shared/.env}:/app/.env:ro
