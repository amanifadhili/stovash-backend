services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22-bookworm-slim}
    image: ${COMPOSE_IMAGE:-stovash-backend}:${RELEASE_ID:-latest}
    container_name: ${COMPOSE_CONTAINER:-stovash-backend}
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "${STOVASH_PORT:-5051}"
      IDENTITY_SERVICE_PORT: "${IDENTITY_SERVICE_PORT:-5052}"
      ACCOUNTING_SERVICE_PORT: "${ACCOUNTING_SERVICE_PORT:-5053}"
      CUSTOMER_SERVICE_PORT: "${CUSTOMER_SERVICE_PORT:-5054}"
      INVENTORY_SERVICE_PORT: "${INVENTORY_SERVICE_PORT:-5055}"
      SALES_SERVICE_PORT: "${SALES_SERVICE_PORT:-5056}"
      PURCHASE_SERVICE_PORT: "${PURCHASE_SERVICE_PORT:-5057}"
      TREASURY_SERVICE_PORT: "${TREASURY_SERVICE_PORT:-5058}"
      TENANT_SERVICE_PORT: "${TENANT_SERVICE_PORT:-5059}"
      NOTIFICATION_SERVICE_PORT: "${NOTIFICATION_SERVICE_PORT:-5060}"
      SEARCH_SERVICE_PORT: "${SEARCH_SERVICE_PORT:-5061}"
      FILE_SERVICE_PORT: "${FILE_SERVICE_PORT:-5062}"
      REPORT_SERVICE_PORT: "${REPORT_SERVICE_PORT:-5063}"
      SUPPLIER_SERVICE_PORT: "${SUPPLIER_SERVICE_PORT:-5064}"
    volumes:
      - ${ENV_FILE:-/home/deploy/stovash/backend/shared/.env}:/app/.env:ro
