name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/stovash-backend

jobs:
  # ── 1. Build & push Docker image to ghcr.io ───────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  # ── 2. Deploy to VPS ───────────────────────────────────────────────────────
  deploy:
    name: Release to /home/deploy/stovash/backend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Pack deploy scripts
        run: |
          tar czf /tmp/stovash-backend-deploy.tgz deploy/
          mv /tmp/stovash-backend-deploy.tgz .

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          source: stovash-backend-deploy.tgz
          target: /tmp

      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE_TAG: ${{ needs.build.outputs.sha }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          SSH_KEY=$(mktemp)
          echo "$SSH_PRIVATE_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -i $SSH_KEY -p $VPS_PORT"

          # Extract deploy scripts on VPS
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail && \
             ROOT=/home/deploy/stovash/backend && \
             mkdir -p \$ROOT/releases \$ROOT/shared && \
             REL=\$ROOT/releases/\$(date -u +%Y%m%d%H%M%S)_${IMAGE_TAG} && \
             mkdir -p \$REL && \
             tar xzf /tmp/stovash-backend-deploy.tgz -C \$REL && \
             chmod +x \$REL/deploy/release-ghcr.sh \$REL/deploy/ensure-docker.sh"

          # Create a runner script locally
          RUNNER=$(mktemp)
          cat > "$RUNNER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          export GHCR_USER='$GHCR_USER'
          export GHCR_TOKEN='$GHCR_TOKEN'
          export IMAGE_TAG='$IMAGE_TAG'
          ROOT=/home/deploy/stovash/backend
          LATEST=\$(ls -1dt \$ROOT/releases/*_${IMAGE_TAG}* 2>/dev/null | head -n1)
          exec \$LATEST/deploy/release-ghcr.sh ${IMAGE} ${IMAGE_TAG}
          EOF
          chmod +x "$RUNNER"

          # SCP runner script to VPS
          scp $SSH_OPTS "$RUNNER" "${VPS_USER}@${VPS_HOST}:/tmp/run-deploy.sh"
          rm -f "$RUNNER"

          # Execute runner fully detached with setsid + nohup
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" \
            "chmod +x /tmp/run-deploy.sh && setsid nohup /tmp/run-deploy.sh > /tmp/stovash-deploy.log 2>&1 &"

          echo "Deployment started on VPS. Polling for completion..."

          # Poll until deploy finishes (max 10 min)
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" \
              "if grep -q 'deployed successfully' /tmp/stovash-deploy.log 2>/dev/null; then echo done; elif pgrep -f run-deploy.sh >/dev/null 2>&1 || pgrep -f release-ghcr.sh >/dev/null 2>&1; then echo running; else echo failed; fi" 2>/dev/null || echo running)
            if [ "$STATUS" = "done" ]; then
              echo "✅ Deployment complete"
              ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "cat /tmp/stovash-deploy.log"
              rm -f "$SSH_KEY"
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "❌ Deployment failed"
              ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "cat /tmp/stovash-deploy.log" || true
              rm -f "$SSH_KEY"
              exit 1
            fi
            echo "Still deploying... ($((i*10))s elapsed)"
          done

          echo "⚠️ Timed out waiting for deploy. Check VPS logs:"
          ssh $SSH_OPTS "${VPS_USER}@${VPS_HOST}" "tail -50 /tmp/stovash-deploy.log" || true
          rm -f "$SSH_KEY"
          exit 1
